name: occb-backend-prod

# Proyecto monorepo en prod: backend (API) + frontend (Next.js).
# - Sin puertos publicados: solo el contenedor de Caddy (proyecto aparte,
#   misma red Docker) alcanza a backend:8000 y frontend:3000.
#   Caddy: `/api/*` -> backend:8000, `/` -> frontend:3000 (mismo origen).
# - DATABASE_URL / REDIS_URL apuntan a los proyectos externos.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
    image: occb-backend:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    networks:
      - edge
    user: "10000:10000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        # Vacío = mismo origen (Caddy sirve app + API en un dominio).
        NEXT_PUBLIC_API_URL: ""
    image: occb-frontend:prod
    restart: unless-stopped
    networks:
      - edge
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

# Red compartida con el proyecto Caddy (él la crea o se crea con
# `docker network create occb-edge`).
networks:
  edge:
    name: occb-edge
    external: true
