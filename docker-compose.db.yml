name: occb-db-dev

# Satélite DB (dev): Postgres 18 + pgvector y Redis en contenedores.
# Se integra a la red principal del backend ("occb-dev", externa: la crea
# el backend con docker-compose.dev.yml, o install-deps.sh / make net).
# El esquema lo versiona el backend: backend/migrations vía scripts/migrate.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: occb-db-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido en .env.dev}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido en .env.dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env.dev}
      PGDATA: /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    # Solo loopback: herramientas del host y el backend usan esta vía en dev.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: occb-redis-dev
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env.dev}
      - --protected-mode
      - "yes"
      - --port
      - "6379"
      - --bind
      - 0.0.0.0
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - DEBUG
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en .env.dev}
    volumes:
      - redisdata-dev:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  edge:
    name: occb-dev
    external: true

volumes:
  pgdata-dev:
  redisdata-dev:
